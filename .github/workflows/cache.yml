name: Cache Workflow

on:
  push:

jobs:
  cache-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cache-step
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: cache-348e5e1

      - name: prime-cache-348e5e1
        run: echo "Cache hit? -> ${{ steps.cache-step.outputs.cache-hit }}"
